name: Nifty 52W low scan

on:
  schedule:
    # 10:45 UTC = 4:15 PM IST, Monday-Friday
    - cron: "45 10 * * 1-5"
  workflow_dispatch:        # "Run workflow" button for a manual run

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          THRESHOLD_PCT: "5"
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scan.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs constituents.csv || true
          git diff --cached --quiet || git commit -m "52W low scan $(date -u +%F)"
          git push
